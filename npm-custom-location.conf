# Nginx Proxy Manager > Proxy Host > Custom locations
# Location: /standalone-signaling/
# Scheme: http | Forward Hostname/IP: IP_DO_SERVIDOR | Port: 8081 (SIGNALING_PORT)
# Clique na engrenagem desse location e cole o bloco abaixo,
# trocando IP_DO_SERVIDOR pelo IP do servidor onde roda o Docker (ex.: 192.168.1.10).
# A "/" final no proxy_pass remove o prefixo /standalone-signaling/.

proxy_pass http://IP_DO_SERVIDOR:8081/;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
